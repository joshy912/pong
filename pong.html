<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --line: #e2e8f0;
      --paddle: #f8fafc;
      --ball: #f59e0b;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #1e293b 0%, var(--bg) 55%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .game-wrap {
      border: 3px solid var(--line);
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.35);
    }

    canvas {
      display: block;
      background: #020617;
    }

    .scoreboard {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      user-select: none;
    }

    .game-box {
      position: relative;
    }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="scoreboard">
      <span id="playerScore">0</span> : <span id="computerScore">0</span>
    </div>
    <canvas id="gameCanvas" width="900" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const playerScoreEl = document.getElementById("playerScore");
    const computerScoreEl = document.getElementById("computerScore");

    const paddleWidth = 14;
    const paddleHeight = 110;
    const paddleSpeed = 7;
    const ballSize = 12;

    const leftPaddle = {
      x: 26,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      dy: 0
    };

    const rightPaddle = {
      x: canvas.width - 26 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      dy: 0
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballSize / 2,
      dx: 5,
      dy: 3,
      speed: 5
    };

    let playerScore = 0;
    let computerScore = 0;

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    const mouse = {
      active: false,
      y: canvas.height / 2
    };

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 5;
      ball.dx = direction * (4 + Math.random() * 1.5);
      ball.dy = (Math.random() * 4 - 2);
    }

    function updateScoreboard() {
      playerScoreEl.textContent = String(playerScore);
      computerScoreEl.textContent = String(computerScore);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function updatePaddles() {
      // Left paddle: mouse or keyboard
      if (mouse.active) {
        leftPaddle.y = mouse.y - leftPaddle.height / 2;
      }

      if (keys.ArrowUp) {
        leftPaddle.y -= paddleSpeed;
      }
      if (keys.ArrowDown) {
        leftPaddle.y += paddleSpeed;
      }

      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);

      // Right paddle: simple AI follows the ball
      const targetY = ball.y - rightPaddle.height / 2;
      const centerDiff = targetY - rightPaddle.y;
      const aiSpeed = 4.2;

      if (Math.abs(centerDiff) > 4) {
        rightPaddle.y += centerDiff > 0 ? aiSpeed : -aiSpeed;
      }

      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);
    }

    function handleBallCollision() {
      // Top and bottom walls
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.dy *= -1;
      } else if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.dy *= -1;
      }

      // Left paddle collision
      if (
        ball.x - ball.radius <= leftPaddle.x + leftPaddle.width &&
        ball.y >= leftPaddle.y &&
        ball.y <= leftPaddle.y + leftPaddle.height &&
        ball.x - ball.radius >= leftPaddle.x
      ) {
        const hitPos = (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
        ball.x = leftPaddle.x + leftPaddle.width + ball.radius;
        ball.dx = Math.abs(ball.dx) + 0.4;
        ball.dy = hitPos * 5 + ball.dy * 0.15;
      }

      // Right paddle collision
      if (
        ball.x + ball.radius >= rightPaddle.x &&
        ball.y >= rightPaddle.y &&
        ball.y <= rightPaddle.y + rightPaddle.height &&
        ball.x + ball.radius <= rightPaddle.x + rightPaddle.width
      ) {
        const hitPos = (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
        ball.x = rightPaddle.x - ball.radius;
        ball.dx = -Math.abs(ball.dx) - 0.4;
        ball.dy = hitPos * 5 + ball.dy * 0.15;
      }

      // Score when ball goes off screen
      if (ball.x - ball.radius < 0) {
        computerScore += 1;
        updateScoreboard();
        resetBall(1);
      } else if (ball.x + ball.radius > canvas.width) {
        playerScore += 1;
        updateScoreboard();
        resetBall(-1);
      }
    }

    function updateBall() {
      ball.x += ball.dx;
      ball.y += ball.dy;

      handleBallCollision();
    }

    function drawBackground() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // center dashed line
      ctx.strokeStyle = "#e2e8f0";
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(x, y, width, height) {
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(x, y, width, height);
    }

    function drawBall(x, y, radius) {
      ctx.fillStyle = "#f59e0b";
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      drawBackground();
      drawPaddle(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
      drawPaddle(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);
      drawBall(ball.x, ball.y, ball.radius);
    }

    function gameLoop() {
      updatePaddles();
      updateBall();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Keyboard controls
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        keys[e.key] = true;
        e.preventDefault();
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        keys[e.key] = false;
        e.preventDefault();
      }
    });

    // Mouse controls for left paddle
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      mouse.y = (e.clientY - rect.top) * scaleY;
      mouse.active = true;
    });

    canvas.addEventListener("mouseleave", () => {
      mouse.active = false;
    });

    updateScoreboard();
    resetBall(1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
